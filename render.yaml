services:
  - type: web
    name: mt5-tracker-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mt5tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://themaksat.github.io

databases:
  - name: mt5tracker-db
    plan: free
